<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d1b0e"/>
      <stop offset="100%" style="stop-color:#1a1814"/>
    </linearGradient>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c8a56a"/>
      <stop offset="100%" style="stop-color:#8b5e2a"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d4b07a"/>
      <stop offset="100%" style="stop-color:#9c6f35"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>

  <!-- Steam wisps -->
  <g opacity="0.7">
    <!-- Left steam -->
    <path d="M196 175 C192 162 200 150 196 138 C192 126 200 114 196 102"
          stroke="#e8c87a" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- Center steam -->
    <path d="M256 165 C252 150 262 136 256 122 C250 108 260 95 256 82"
          stroke="#e8c87a" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.8"/>
    <!-- Right steam -->
    <path d="M316 175 C320 162 312 150 316 138 C320 126 312 114 316 102"
          stroke="#e8c87a" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Pot body -->
  <g filter="url(#shadow)">
    <!-- Pot body main shape -->
    <path d="M155 230 C150 230 148 232 148 238 L160 370 C162 390 175 405 195 408 L317 408 C337 408 350 390 352 370 L364 238 C364 232 362 230 357 230 Z"
          fill="url(#potGrad)"/>

    <!-- Pot rim highlight -->
    <ellipse cx="256" cy="230" rx="101" ry="18" fill="url(#lidGrad)"/>

    <!-- Lid -->
    <path d="M155 222 C155 205 200 192 256 192 C312 192 357 205 357 222 L357 236 C357 242 355 245 352 246 L160 246 C157 245 155 242 155 236 Z"
          fill="url(#lidGrad)"/>

    <!-- Lid knob -->
    <ellipse cx="256" cy="192" rx="22" ry="12" fill="#d4b07a"/>
    <ellipse cx="256" cy="186" rx="14" ry="8" fill="#c8a56a"/>
    <ellipse cx="256" cy="183" rx="8" ry="5" fill="#e8c87a"/>

    <!-- Left handle -->
    <path d="M155 250 C130 248 115 265 118 282 C121 299 140 305 160 300 L160 268 C152 270 138 268 138 257 C138 248 150 248 155 250 Z"
          fill="url(#potGrad)"/>
    <ellipse cx="138" cy="275" rx="20" ry="27" fill="url(#lidGrad)" opacity="0.8"/>

    <!-- Right handle -->
    <path d="M357 250 C382 248 397 265 394 282 C391 299 372 305 352 300 L352 268 C360 270 374 268 374 257 C374 248 362 248 357 250 Z"
          fill="url(#potGrad)"/>
    <ellipse cx="374" cy="275" rx="20" ry="27" fill="url(#lidGrad)" opacity="0.8"/>

    <!-- Sheen on pot body -->
    <path d="M175 250 C170 250 168 252 168 258 L180 365 C181 372 184 378 188 381 L200 381 C196 378 193 372 192 365 L180 258 C180 252 178 250 175 250 Z"
          fill="white" opacity="0.12"/>
  </g>

  <!-- Small fork/spoon icon on pot (decorative) -->
  <g transform="translate(256, 320)" opacity="0.3">
    <line x1="-20" y1="-30" x2="-20" y2="30" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="-30" x2="20" y2="30" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
